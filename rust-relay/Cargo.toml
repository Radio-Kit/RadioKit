[package]
name = "radiokit-relay"
version = "0.1.0"
edition = "2021"
description = "Cloud relay for RadioKit — routes WebSocket binary frames between ESP32 devices and Flutter clients with account scoping"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
