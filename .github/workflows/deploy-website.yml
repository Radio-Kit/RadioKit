name: Deploy Website

on:
  push:
    branches: [main, dev]
    paths:
      - 'website/**'
      - 'themes/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: withastro/action@v3
        with:
          path: website
          node-version: 22

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: website/dist
          retention-days: 1
          overwrite: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
