name: Deploy Website

on:
  push:
    branches: [main, dev]
    paths:
      - 'website/**'
      - 'themes/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: withastro/action@v3
        with:
          path: website
          node-version: 22

      - name: Fix artifact (remove symlinks/hardlinks)
        run: |
          cd website/dist
          find . -type l -delete
          find . -type f -links +1 -exec sh -c 'cp --remove-destination "$1" "$1"' _ {} \;

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
