name: Release Flatpak

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-pip
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.gnome.Platform//47 \
            org.gnome.Sdk//47
          pip install packaging pyyaml tomlkit

      - name: Pre-process manifest with flatpak-flutter
        run: |
          VERSION=${GITHUB_REF_NAME:-main}
          sed -i "s/tag: main/tag: ${VERSION}/" flatpak/flatpak-flutter.yml
          git clone --depth=1 https://github.com/TheAppgineer/flatpak-flutter.git /tmp/flatpak-flutter
          python3 /tmp/flatpak-flutter/flatpak-flutter.py \
            --app-pubspec radiokit-app \
            --extra-pubspecs flutter-widgets \
            flatpak/flatpak-flutter.yml

      - name: Build Flatpak
        run: |
          flatpak-builder --repo=repo --force-clean \
            --install-deps-from=flathub \
            build-dir com.rambros3d.radiokit.yml

      - name: Export .flatpak bundle
        run: |
          VERSION=${GITHUB_REF_NAME:-latest}
          flatpak build-bundle repo "radiokit-${VERSION}.flatpak" com.rambros3d.radiokit

      - name: Create or update GitHub Release
        if: startsWith(github.ref_name, 'v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLATPAK_FILE=$(find . -maxdepth 1 -name "radiokit-*.flatpak" | head -n 1)
          if [ -n "$FLATPAK_FILE" ]; then
            if gh release view "${GITHUB_REF_NAME}" --json id >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "$FLATPAK_FILE" --clobber
            else
              gh release create "${GITHUB_REF_NAME}" "$FLATPAK_FILE" --generate-notes
            fi
          fi
