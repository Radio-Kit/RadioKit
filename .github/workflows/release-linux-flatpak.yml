name: Release Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.1.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  flatpak:
    name: Build Linux Flatpak (x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-pip
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Sdk.Extension.llvm18/x86_64/24.08
          pip install packaging pyyaml tomlkit

      - name: Pre-process manifest with flatpak-flutter
        run: |
          git clone --depth=1 https://github.com/TheAppgineer/flatpak-flutter.git /tmp/flatpak-flutter
          python3 /tmp/flatpak-flutter/flatpak-flutter.py \
            --app-pubspec radiokit-app \
            --extra-pubspecs flutter-widgets \
            flatpak/flatpak-flutter.yml

      - name: Build Flatpak
        run: |
          flatpak-builder --repo=repo --force-clean \
            --install-deps-from=flathub \
            build-dir com.rambros3d.radiokit.yml

      - name: Export .flatpak bundle
        id: package
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          
          mkdir -p dist
          BUNDLE_NAME="radiokit-${TAG}-linux-x86_64.flatpak"
          flatpak build-bundle repo "dist/${BUNDLE_NAME}" com.rambros3d.radiokit
          
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          files: |
            dist/radiokit-*-linux-x86_64.flatpak
          generate_release_notes: true
          draft: false
          prerelease: false
