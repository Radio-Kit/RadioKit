name: Relay CI

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
      - '*-apk'
      - '*-ios'
      - '*-linux'
      - '*-win'
      - '*-mac'
  pull_request:
    branches: [main]

jobs:
  relay:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            radiokit-relay/target
          key: relay-${{ hashFiles('radiokit-relay/Cargo.lock') }}

      - name: Check formatting
        working-directory: radiokit-relay
        run: cargo fmt --check

      - name: Clippy
        working-directory: radiokit-relay
        run: cargo clippy -- -D warnings

      - name: Build
        working-directory: radiokit-relay
        run: cargo build

      - name: Test
        working-directory: radiokit-relay
        run: cargo test
