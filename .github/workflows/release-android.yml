name: Release Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.1.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd radiokit-app
          flutter pub get
          cd ../flutter-widgets
          flutter pub get

      - name: Build Android APK
        run: |
          cd radiokit-app
          flutter build apk --release

      - name: Package Android APK
        id: package
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          
          mkdir -p dist
          APK_PATH=$(find radiokit-app/build/app/outputs/flutter-apk -name "app-release.apk" -o -name "app-*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          
          cp "$APK_PATH" "dist/radiokit-${TAG}-android.apk"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          files: |
            dist/radiokit-*-android.apk
          generate_release_notes: true
          draft: false
          prerelease: false
