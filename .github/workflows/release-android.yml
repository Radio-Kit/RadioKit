name: Release Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build library zip
        run: bash scripts/build-library-zip.sh

      - name: Install dependencies
        run: |
          cd radiokit-app
          flutter pub get

      - name: Build Android APK
        run: |
          cd radiokit-app
          flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME:-latest}
          APK_PATH=$(find radiokit-app/build -name "app-release.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "radiokit-${VERSION}.apk"

      - name: Create or update GitHub Release
        if: startsWith(github.ref_name, 'v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find . -maxdepth 1 -name "radiokit-*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            if gh release view "${GITHUB_REF_NAME}" --json id >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "$APK_FILE" --clobber
            else
              gh release create "${GITHUB_REF_NAME}" "$APK_FILE" --generate-notes
            fi
          fi
