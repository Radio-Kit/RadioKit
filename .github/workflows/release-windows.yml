name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd radiokit-app
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows
        run: |
          cd radiokit-app
          flutter build windows --release

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Windows Installer
        run: |
          $VERSION = $env:GITHUB_REF_NAME
          if (-not $VERSION -or $VERSION -eq "") { $VERSION = "latest" }
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DMyAppVersion="$VERSION" /F"radiokit-windows-x64" radiokit-app\windows\installer\RadioKit.iss
          $EXE = Get-ChildItem -Path radiokit-app\windows\installer -Filter "*.exe" | Select-Object -First 1
          if ($EXE) {
            Copy-Item -Path $EXE.FullName -Destination "radiokit-windows-x64.exe" -Force
          }

      - name: Create or update GitHub Release
        if: startsWith(github.ref_name, 'v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path "radiokit-windows-x64.exe") {
            Write-Host "Found installer: radiokit-windows-x64.exe"
            $null = gh release view "$env:GITHUB_REF_NAME" --json id 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh release upload "$env:GITHUB_REF_NAME" "radiokit-windows-x64.exe" --clobber
            } else {
              gh release create "$env:GITHUB_REF_NAME" "radiokit-windows-x64.exe" --generate-notes
            }
          } else {
            Write-Error "Installer exe not found!"
          }
