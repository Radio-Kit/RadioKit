name: Release iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.1.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  ios:
    name: Build iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd radiokit-app
          flutter pub get
          cd ../flutter-widgets
          flutter pub get

      - name: Build iOS IPA
        run: |
          cd radiokit-app
          flutter build ios --release --no-codesign

      - name: Package iOS IPA
        id: package
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          
          mkdir -p dist
          mkdir -p /tmp/Payload
          cp -r radiokit-app/build/ios/iphoneos/Runner.app /tmp/Payload/
          (cd /tmp && zip -r "${OLDPWD}/dist/radiokit-${TAG}-ios-unsigned.ipa" Payload)
          
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          files: |
            dist/radiokit-*-ios-unsigned.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
