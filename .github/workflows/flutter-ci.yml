name: Flutter Analyze & Test

on:
  push:
    branches: [main]
    tags-ignore:
      - "v*"
      - "*-apk"
      - "*-ios"
      - "*-linux"
      - "*-win"
      - "*-mac"
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: |
          cd radiokit-app
          flutter pub get
          cd ../flutter-widgets
          flutter pub get

      - name: Analyze
        run: |
          cd radiokit-app
          flutter analyze --fatal-warnings

      - name: Run tests
        run: |
          cd radiokit-app
          flutter test
