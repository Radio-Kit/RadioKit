name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build library zip
        run: bash scripts/build-library-zip.sh

      - name: Install dependencies
        run: |
          cd radiokit-app
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Build macOS
        run: |
          cd radiokit-app
          flutter config --enable-macos-desktop
          flutter create --platforms=macos .
          flutter build macos --release

      - name: Package macOS DMG
        run: |
          VERSION=${GITHUB_REF_NAME:-latest}
          DMG_NAME="radiokit-${VERSION}-macos.dmg"
          
          # Auto-discover the .app bundle
          APP_PATH=$(find radiokit-app/build -name '*.app' -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found in build directory"
            find radiokit-app/build -type d -maxdepth 5 | head -20
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          
          hdiutil create -volname "RadioKit" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"
          echo "Created $DMG_NAME"

      - name: Create or update GitHub Release
        if: startsWith(github.ref_name, 'v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_FILE=$(find . -maxdepth 1 -name "radiokit-*-macos.dmg" | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            if gh release view "${GITHUB_REF_NAME}" --json id >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "$DMG_FILE" --clobber
            else
              gh release create "${GITHUB_REF_NAME}" "$DMG_FILE" --generate-notes
            fi
          fi
