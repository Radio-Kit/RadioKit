name: Release

on:
  push:
    tags:
      - 'v*'
      - '*-flatpak'

jobs:
  release:
    name: Build and Release (Android + iOS)
    if: startsWith(github.ref_name, 'v') && !endsWith(github.ref_name, '-flatpak')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd flutter-app
          flutter pub get

      - name: Build Android APK
        run: |
          cd flutter-app
          flutter build apk --release

      - name: Build iOS IPA
        run: |
          cd flutter-app
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r radiokit.ipa Payload

      - name: Rename and Prepare Artifacts
        run: |
          VERSION=${GITHUB_REF_NAME}
          
          # Find and rename APK
          APK_PATH=$(find . -name "app-release.apk" | grep -v "outputs/apk/release" || find . -name "app-release.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "radiokit-${VERSION}.apk"
          
          # Find and rename IPA
          IPA_PATH=$(find . -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"
          cp "$IPA_PATH" "radiokit-${VERSION}.ipa"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            radiokit-*.apk
            radiokit-*.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flatpak:
    name: Build Flatpak
    if: endsWith(github.ref_name, '-flatpak')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install flatpak-builder and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-pip
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08
          pip install packaging pyyaml tomlkit

      - name: Pre-process manifest with flatpak-flutter
        run: |
          git clone --depth=1 https://github.com/TheAppgineer/flatpak-flutter.git /tmp/flatpak-flutter
          python3 /tmp/flatpak-flutter/flatpak-flutter.py \
            --app-pubspec flutter-app \
            --extra-pubspecs flutter-library \
            flatpak/flatpak-flutter.yml

      - name: Build Flatpak
        run: |
          flatpak-builder --repo=repo --force-clean --sandbox \
            --install-deps-from=flathub \
            build-dir flatpak/com.rambros3d.radiokit.yml

      - name: Export .flatpak bundle
        run: |
          flatpak build-bundle repo radiokit.flatpak com.rambros3d.radiokit

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json id >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" radiokit.flatpak --clobber
          else
            gh release create "${GITHUB_REF_NAME}" radiokit.flatpak --generate-notes
          fi
